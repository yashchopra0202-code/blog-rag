# .github/workflows/daily.yml
name: daily-nuggets
on:
  schedule:
    - cron: "0 4 * * *"    # 04:00 UTC = 09:30 IST daily; digest.py decides whether to email (see config.json cadence)
  workflow_dispatch:
    inputs:
      force:
        description: "Send the digest now even if cadence says it's not a send day"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-nuggets
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}   # optional; unset -> Sentry is a no-op
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RAG deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      # Best-effort: scrapling's full stealth-browser stack (curl_cffi, patchright,
      # camoufox/playwright browsers) is fiddly on CI runners. This step is
      # non-fatal — if it can't build, the Scrape step below no-ops and the daily
      # EMAIL still sends from the existing manifest. Reliable fresh scraping is
      # done locally (see README "Daily nuggets"); CI scraping is a bonus.
      - name: Install scraper (scrapling) deps
        continue-on-error: true
        run: |
          python -m venv .venv-scrapling
          .venv-scrapling/bin/pip install "scrapling[fetchers]" click
          .venv-scrapling/bin/scrapling install || true
      # Every pipeline step is continue-on-error so the run always reaches the
      # Health check & alert step below, which decides pass/fail and notifies.
      - name: Scrape
        id: scrape
        continue-on-error: true
        run: .venv-scrapling/bin/python scraper.py
      - name: Upload articles to Storage
        id: upload_articles
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: .venv/bin/python upload_articles.py
      - name: Nuggetize
        id: nuggetize
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python nuggetize.py
      - name: Email digest
        id: digest
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_LIMIT: "20"   # daily cap; weekly uses config.json weekly_limit
          DIGEST_FORCE: ${{ github.event.inputs.force }}
          FEED_URL: ${{ secrets.FEED_URL }}   # live Render URL; empty -> digest.py falls back to localhost
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}          # digest.py tracks send-state in Postgres via store.py
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: .venv/bin/python digest.py
      - name: Telegram broadcast
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FEED_URL: ${{ secrets.FEED_URL }}
          DIGEST_FORCE: ${{ github.event.inputs.force }}
        run: .venv/bin/python telegram_digest.py
      - name: Commit refreshed data
        run: |
          git config user.name "yashchopra0202-code"
          git config user.email "yashchopra0202@gmail.com"
          git add data/articles data/manifest.json data/digest_state.json data/telegram_state.json
          git diff --cached --quiet || git commit -m "chore: daily nugget refresh [skip ci]"
          git push
      - name: Health check & alert
        if: always()
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          NUGGETIZE_OUTCOME: ${{ steps.nuggetize.outcome }}
          DIGEST_OUTCOME: ${{ steps.digest.outcome }}
          TELEGRAM_OUTCOME: ${{ steps.telegram.outcome }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .venv/bin/python alert.py
